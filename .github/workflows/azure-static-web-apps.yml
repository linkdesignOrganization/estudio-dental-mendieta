name: Build and Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Allow one concurrent deployment per ref; cancel superseded runs.
concurrency:
  group: swa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      # Angular 21 requires Node ^20.19 || ^22.12 || >=24. We pin 22.x (LTS)
      # for reproducible CI builds. Oryx (inside the SWA action) honors the
      # version exported below via NODE_VERSION when building the app.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          ###### Repository/Build Configurations ######
          # app_location: path to the Angular app source, relative to repo root.
          #   The Angular project lives at the repo root, so "/" is correct.
          # api_location: empty — this is a frontend-only app (no Functions API).
          # output_location: path to the built static files, relative to app_location.
          #   The @angular/build (application) builder emits to dist/<app>/browser.
          #   Real project name is "estudio-dental-mendieta" → verified locally to
          #   produce dist/estudio-dental-mendieta/browser.
          # app_build_command: run the project's own build script EXPLICITLY so the
          #   "prebuild" lifecycle hook (node scripts/generate-manifest.mjs) ALWAYS
          #   runs before `ng build` — generating public/seed/manifest.json and
          #   copying patient photos into public/imagenes/. Relying on Oryx's
          #   implicit `npm run build` can skip npm pre*/post* hooks; pinning the
          #   command guarantees the seed manifest is materialized in the bundle.
          app_location: "/"
          api_location: ""
          output_location: "dist/estudio-dental-mendieta/browser"
          app_build_command: "npm run build"
        env:
          # Pin the Node version Oryx uses for the build (Angular 21 needs >=22.12).
          NODE_VERSION: "22"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
